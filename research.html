<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader's Lab — Research Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/research.css">
</head>
<body>

<div class="app-header">
  <h1>Trader's Lab</h1>
  <span class="sub">Research Dashboard</span>
  <div class="subtitle">
    <a href="charts.html">← Back to Charts</a>
  </div>
</div>

<div class="container">
  <div class="filter-bar">
    <label>Search</label>
    <input type="text" id="searchInput" placeholder="Symbol..." style="width:120px;">

    <label>Sentiment</label>
    <select id="sentimentFilter">
      <option value="all">All</option>
      <option value="bullish">Bullish</option>
      <option value="bearish">Bearish</option>
      <option value="neutral">Neutral</option>
    </select>

    <div class="stats" id="statsBar">
      <span id="totalCount">—</span>
      <span><span class="stat-dot" style="background:var(--color-up)"></span><span id="bullCount">—</span></span>
      <span><span class="stat-dot" style="background:var(--color-down)"></span><span id="bearCount">—</span></span>
      <span><span class="stat-dot" style="background:var(--color-neutral)"></span><span id="neutCount">—</span></span>
    </div>
    <span style="display:flex;align-items:center;gap:var(--space-1);">
      <label style="font-size:var(--text-xs);">Chg</label>
      <span style="display:flex;gap:0;">
        <button class="tf-btn active" data-tf="d1" onclick="setChangeTf('d1')">1D</button>
        <button class="tf-btn" data-tf="w1" onclick="setChangeTf('w1')">1W</button>
        <button class="tf-btn" data-tf="m1" onclick="setChangeTf('m1')">1M</button>
        <button class="tf-btn" data-tf="y1" onclick="setChangeTf('y1')">1Y</button>
      </span>
    </span>
    <button class="gen-btn" onclick="batchGenerateResearch()">Generate Insights</button>
    <div class="research-status" id="researchStatus">
      <span class="spinner"></span>
      <span class="rs-label"></span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:28px"></th>
          <th onclick="setSort('symbol')">Symbol <span class="sort-arrow" data-col="symbol"></span></th>
          <th class="num" onclick="setSort('change')">Change <span id="changeLabel" style="font-size:10px;color:var(--color-accent);">1D</span><span class="sort-arrow" data-col="change"></span></th>
          <th onclick="setSort('sentiment')">Sentiment <span class="sort-arrow" data-col="sentiment"></span></th>
          <th class="num" onclick="setSort('confidence')">Confidence <span class="sort-arrow" data-col="confidence"></span></th>
          <th class="num" onclick="setSort('bestStrat')">Best Strat <span class="sort-arrow" data-col="bestStrat"></span></th>
          <th class="num" onclick="setSort('winRate')">Win Rate <span class="sort-arrow" data-col="winRate"></span></th>
          <th onclick="setSort('lastResearch')">Last Research <span class="sort-arrow" data-col="lastResearch"></span></th>
          <th class="num" onclick="setSort('entries')">Entries <span class="sort-arrow" data-col="entries"></span></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="9"><div class="loading">Loading research data…</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

    <script src="js/shared.js" defer></script>
    <script src="js/research.js" defer></script>
</body>
</html>
