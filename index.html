<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader's Lab</title>
<meta name="description" content="Trader's Lab — crypto research and trading terminal with technical charting and cross-pair research tools.">
<meta name="theme-color" content="#0d1117">
<meta property="og:title" content="Trader's Lab">
<meta property="og:description" content="Crypto research and trading terminal with technical charting and cross-pair research tools.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .brand {
    text-align: center;
    margin-bottom: 48px;
  }
  .brand h1 {
    font-size: 42px;
    font-weight: 700;
    background: linear-gradient(135deg, #2962ff, #7c3aed, #089981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }
  .brand p {
    color: #9aa4b2;
    font-size: 14px;
    margin-top: 8px;
  }

  .cards {
    display: flex;
    gap: 24px;
  }

  .card {
    width: 260px;
    max-width: 100%;
    padding: 32px 24px;
    border: 1px solid #30363d;
    border-radius: 12px;
    background: #161b22;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    text-align: center;
    cursor: pointer;
  }
  .card:hover {
    border-color: #2962ff;
    background: #1c2333;
    transform: translateY(-2px);
  }
  .card:focus-visible {
    border-color: #2962ff;
    background: #1c2333;
    outline: 2px solid #2962ff;
    outline-offset: 2px;
  }
  .card .icon {
    font-size: 36px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card p {
    font-size: 13px;
    color: #9aa4b2;
    line-height: 1.5;
  }
  .card .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 2px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    background: rgba(41, 98, 255, 0.15);
    color: #2962ff;
  }

  @media (max-width: 640px) {
    .cards { flex-direction: column; }
  }
</style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>Trader's Lab</h1>
      <p>Crypto research & trading terminal</p>
    </header>
    <div class="cards">
      <a class="card" href="charts.html" aria-label="Open Charts terminal — technical indicators, signal builder, paper trading">
        <div class="icon" aria-hidden="true">📈</div>
        <h2>Charts</h2>
        <p>Technical indicators, signal builder, paper trading. One pair at a time, deep focus.</p>
        <span class="badge">Open Terminal</span>
      </a>
      <a class="card" href="research.html" aria-label="Open Research dashboard — cross-pair sentiment consensus and strategy history">
        <div class="icon" aria-hidden="true">🔬</div>
        <h2>Research</h2>
        <p>Cross-pair dashboard — sentiment consensus, best strategies, research history. All pairs at once.</p>
        <span class="badge">Open Dashboard</span>
      </a>
    </div>
  </main>
  <script src="js/index.js" defer></script>
</body>
</html>
